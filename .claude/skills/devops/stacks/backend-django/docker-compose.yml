# Ambiente dev: stack local completa, espelho de hom/prod. Uma imagem, vários papéis.
#   docker compose up -d --build
#   docker compose run --rm -e ROLE=manage web createsuperuser
x-env: &env
  APP_ENV: dev
  DJANGO_SETTINGS_MODULE: config.settings.local
  DATABASE_URL: postgres://app:app@postgres:5432/app
  CELERY_BROKER_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  STORAGE_ENDPOINT_URL: http://minio:9000
  STORAGE_ACCESS_KEY: minioadmin
  STORAGE_SECRET_KEY: minioadmin
  STORAGE_BUCKET: app-local

x-app: &app
  build: .
  env_file: .env           # segredos locais (DJANGO_SECRET_KEY, chaves de sandbox)
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  web:
    <<: *app
    environment:
      <<: *env
      ROLE: web
      RUN_MIGRATIONS: "1"
    ports: ["8000:8000"]

  worker:
    <<: *app
    environment:
      <<: *env
      ROLE: worker
      CELERY_QUEUES: default,integrations,ai

  beat:
    <<: *app
    environment:
      <<: *env
      ROLE: beat

  postgres:
    image: postgres:17
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:

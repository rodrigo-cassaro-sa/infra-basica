name: ${COMPOSE_PROJECT_NAME:-app}

# ==========================================================
# TODOS OS AMBIENTES JUNTOS — uso local
#
# No EasyPanel cada ambiente é um serviço Compose próprio,
# apontando para o arquivo e a branch do ambiente:
#
#   <projeto>-dev   docker-compose.dev.yml    branch develop
#   <projeto>-hom   docker-compose.hom.yml    branch develop
#   <projeto>-prod  docker-compose.prod.yml   branch main
#
# Local:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# ==========================================================

include:
  - docker-compose.dev.yml
  - docker-compose.hom.yml
  - docker-compose.prod.yml

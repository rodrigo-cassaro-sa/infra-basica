name: ${COMPOSE_PROJECT_NAME:-app}

services:
  # ========================================================
  # WORKSPACE PRIVADO DE DESENVOLVIMENTO
  # Copia o checkout do EasyPanel UMA VEZ para um volume.
  # Nunca altera dono/permissões do repositório do EasyPanel.
  # ========================================================
  workspace-init:
    image: alpine:3.20
    restart: "no"
    command: >
      sh -c '
        set -eu;
        if [ ! -d /workspace/.git ]; then
          echo "Inicializando workspace privado...";
          cp -a /seed/. /workspace/;
        else
          echo "Workspace já inicializado; mantendo alterações locais.";
        fi;
        chown -R 1000:1000 /workspace;
      '
    volumes:
      - ./:/seed:ro
      - coder_workspace:/workspace

  # ========================================================
  # POSTGRESQL - DEV
  # ========================================================
  postgres-dev:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEV_DB_NAME:-app_dev}
      POSTGRES_USER: ${DEV_DB_USER:-app_dev}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-dev-change-me}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_DB_USER:-app_dev} -d ${DEV_DB_NAME:-app_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========================================================
  # POSTGRESQL - HOM
  # ========================================================
  postgres-hom:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HOM_DB_NAME:-app_hom}
      POSTGRES_USER: ${HOM_DB_USER:-app_hom}
      POSTGRES_PASSWORD: ${HOM_DB_PASSWORD:-hom-change-me}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_hom_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HOM_DB_USER:-app_hom} -d ${HOM_DB_NAME:-app_hom}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========================================================
  # POSTGRESQL - PROD
  # ========================================================
  postgres-prod:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PROD_DB_NAME:-app_prod}
      POSTGRES_USER: ${PROD_DB_USER:-app_prod}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:-prod-change-me}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_DB_USER:-app_prod} -d ${PROD_DB_NAME:-app_prod}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========================================================
  # DJANGO - DEV
  # Usa o MESMO workspace privado do Code Server.
  # Alterações feitas no Code Server aparecem no DEV.
  # ========================================================
  django-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /workspace/backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY_DEV:-dev-insecure-change-me}
      DJANGO_ALLOWED_HOSTS: ${DEV_ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${DEV_CORS_ALLOWED_ORIGINS:-}
      DB_HOST: postgres-dev
      DB_PORT: 5432
      DB_NAME: ${DEV_DB_NAME:-app_dev}
      DB_USER: ${DEV_DB_USER:-app_dev}
      DB_PASSWORD: ${DEV_DB_PASSWORD:-dev-change-me}
      TZ: ${TZ:-America/Sao_Paulo}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - coder_workspace:/workspace
    expose:
      - "8000"
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      postgres-dev:
        condition: service_healthy

  # ========================================================
  # DJANGO - HOM
  # Usa o código implantado pelo EasyPanel/Git.
  # ========================================================
  django-hom:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.homologation
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY_HOM:-hom-insecure-change-me}
      DJANGO_ALLOWED_HOSTS: ${HOM_ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${HOM_CORS_ALLOWED_ORIGINS:-}
      DB_HOST: postgres-hom
      DB_PORT: 5432
      DB_NAME: ${HOM_DB_NAME:-app_hom}
      DB_USER: ${HOM_DB_USER:-app_hom}
      DB_PASSWORD: ${HOM_DB_PASSWORD:-hom-change-me}
      TZ: ${TZ:-America/Sao_Paulo}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    expose:
      - "8000"
    depends_on:
      postgres-hom:
        condition: service_healthy

  # ========================================================
  # DJANGO - PROD
  # Usa o código implantado pelo EasyPanel/Git.
  # ========================================================
  django-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY_PROD:-prod-insecure-change-me}
      DJANGO_ALLOWED_HOSTS: ${PROD_ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${PROD_CORS_ALLOWED_ORIGINS:-}
      DB_HOST: postgres-prod
      DB_PORT: 5432
      DB_NAME: ${PROD_DB_NAME:-app_prod}
      DB_USER: ${PROD_DB_USER:-app_prod}
      DB_PASSWORD: ${PROD_DB_PASSWORD:-prod-change-me}
      TZ: ${TZ:-America/Sao_Paulo}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    expose:
      - "8000"
    depends_on:
      postgres-prod:
        condition: service_healthy

  # ========================================================
  # EXPO - DEV (Metro + Web)
  # Usa o MESMO workspace privado do Code Server.
  # ========================================================
  expo-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    working_dir: /workspace/frontend
    environment:
      NODE_ENV: development
      CI: "1"
      EXPO_PUBLIC_API_URL: ${DEV_API_URL:-}
      TZ: ${TZ:-America/Sao_Paulo}
    command: >
      sh -c "npm install && npx expo start --web --port 8081"
    volumes:
      - coder_workspace:/workspace
      - expo_node_modules:/workspace/frontend/node_modules
    expose:
      - "8081"
    depends_on:
      workspace-init:
        condition: service_completed_successfully

  # ========================================================
  # EXPO WEB - HOM
  # Build estático a partir do checkout do EasyPanel/Git.
  # ========================================================
  expo-hom:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
      args:
        EXPO_PUBLIC_API_URL: ${HOM_API_URL:-https://api-hom.exemplo.com}
    restart: unless-stopped
    expose:
      - "80"

  # ========================================================
  # EXPO WEB - PROD
  # Build estático a partir do checkout do EasyPanel/Git.
  # ========================================================
  expo-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
      args:
        EXPO_PUBLIC_API_URL: ${PROD_API_URL:-https://api.exemplo.com}
    restart: unless-stopped
    expose:
      - "80"

  # ========================================================
  # CODE SERVER - UM POR PROJETO
  # NUNCA monta ./: como workspace gravável.
  # ========================================================
  code-server:
    build:
      context: ./coder
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PASSWORD: ${CODER_PASSWORD:-change-me-coder}
      TZ: ${TZ:-America/Sao_Paulo}
      CLAUDE_CONFIG_DIR: /home/coder/.claude
      GIT_CONFIG_GLOBAL: /home/coder/.config/git/config
    volumes:
      - coder_workspace:/home/coder/workspace
      - coder_config:/home/coder/.config
      - coder_local:/home/coder/.local
      - coder_claude:/home/coder/.claude
      - coder_ssh:/home/coder/.ssh
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      workspace-init:
        condition: service_completed_successfully

volumes:
  postgres_dev_data:
  postgres_hom_data:
  postgres_prod_data:
  expo_node_modules:

  # Workspace privado do desenvolvimento.
  coder_workspace:

  # Preferências, extensões e autenticações persistentes.
  coder_config:
  coder_local:
  coder_claude:
  coder_ssh:
